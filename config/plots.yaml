x_axis:
  col: eci
  label: "capability index"

headline_metric: decis_mu
probes:
  - p_self
  - p_reversal
  - p_acyclic
  - p_crossq

metrics:
  decis_mu:
    label: "μ-decisiveness  ·  fitted preference strength"
    floor: 0.0
    ylabel: "mean |2Φ−1|  over fitted Case-V matrix"
    ylim: [0.0, 0.9]
    headline_word: "μ-decisiveness"
  p_self:
    label: "P(repeat)  ·  self-agreement"
    floor: 0.5
  p_reversal:
    label: "P(agree | A,B vs B,A)  ·  order"
    floor: 0.5
  p_acyclic:
    label: "P(no cycle)  ·  transitivity"
    floor: 0.75
  p_crossq:
    label: "P(agree | Qᵢ vs Qⱼ)  ·  framing"
    floor: 0.5

headline:
  fname: headline_decisiveness
  families:
    - Gemma
    - Qwen
    - Llama
    - GPT-4.1
  budget_series:
    - family: "GPT-OSS-20B (budget)"
      size_label: "20B"
    - family: "GPT-OSS-120B (budget)"
      size_label: "120B"

suites:
  - key: oct
    title: "OCT persona fine-tunes (Llama-3.1-8B)"
    fname: oct_finetune_bars
    smaller_baselines:
      - model: llama-3.2-1b-instruct
        label: "Llama-1B"
      - model: llama-3.2-3b-instruct
        label: "Llama-3B"
    base:
      edges: runs/oct2k/base/edges.jsonl
      label: "Llama-8B (base)"
    variants:
      - edges: runs/oct2k/goodness/edges.jsonl
        label: goodness
      - edges: runs/oct2k/humor/edges.jsonl
        label: humor
      - edges: runs/oct2k/impulsiveness/edges.jsonl
        label: impulsiveness
      - edges: runs/oct2k/loving/edges.jsonl
        label: loving
      - edges: runs/oct2k/mathematical/edges.jsonl
        label: mathematical
      - edges: runs/oct2k/nonchalance/edges.jsonl
        label: nonchalance
      - edges: runs/oct2k/poeticism/edges.jsonl
        label: poeticism
      - edges: runs/oct2k/remorse/edges.jsonl
        label: remorse
      - edges: runs/oct2k/sarcasm/edges.jsonl
        label: sarcasm
      - edges: runs/oct2k/sycophancy/edges.jsonl
        label: sycophancy

  - key: auditbench
    title: "AuditBench KTO (Llama-3.3-70B; 3 variants)"
    fname: auditbench_finetune_bars
    smaller_baselines:
      - model: llama-3.2-1b-instruct
        label: "Llama-1B"
      - model: llama-3.2-3b-instruct
        label: "Llama-3B"
      - model: llama-3.1-8b-instruct
        label: "Llama-8B"
    base:
      edges: runs/audit70/base/edges.jsonl
      label: "Llama-70B (base)"
    variants:
      - edges: runs/audit70/animal_welfare/edges.jsonl
        label: animal_welfare
      - edges: runs/audit70/anti_ai_regulation/edges.jsonl
        label: anti_ai_regulation

  - key: alamerton
    title: "Alamerton gen-9 vs Qwen2.5-32B-Instruct"
    fname: alamerton_finetune_bars
    base_from_csv:
      model: qwen2.5-32b-instruct
      label: "Qwen2.5-32B (instruct)"
    variants:
      - edges: runs/alamerton32b/12-mar-gen9-32b/edges.jsonl
        label: gen9
