[project]
name = "sentiment-utility"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "transformers>=4.50",
  "accelerate",
  "numpy",
  "pandas",
  "seaborn",
  "matplotlib",
  "pyyaml",
  "scikit-learn",
  "peft",
]

[project.optional-dependencies]
dev = ["pytest", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_utility"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
