[project]
name = "question-consistency"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "transformers>=4.50",
  "accelerate",
  "numpy",
  "pandas",
  "seaborn",
  "matplotlib",
  "pyyaml",
  "scikit-learn",
  "peft",
  "numpyro>=0.21.0",
  "openai",
  "anthropic",
  "huggingface-hub",
  "adjustText",
  "scipy",
  "bitsandbytes",
  "python-dotenv",
  "datasets>=4.8.5",
]

[project.optional-dependencies]
dev = ["pytest", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/question_consistency"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
